<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Hakari: a heads-up Discard Hold'em bot in one file</title>
<desc id="banner-desc">Synergy '26 Pokerbots entry, IIIT Bangalore. Team Hakari: Bhavya Jain, Kanav Bhardwaj. A heads-up Discard Hold'em bot combining an equity engine, an opponent model and a CFR strategy table in a single bot.py of 1.4 MB, standard library and NumPy only, 0 forfeits in testing, paced to stay inside the time bank at one-sixth CPU speed.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f5a524" stop-opacity="0.16"/><stop offset="1" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d6322b"/><stop offset="0.5" stop-color="#f5a524"/><stop offset="1" stop-color="#d6322b"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="320" fill="#100c0c"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<ellipse cx="1030" cy="160" rx="300" ry="190" fill="url(#glow)"/>
<rect y="314" width="1280" height="6" fill="url(#rule)"/>
<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#1f2a37"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="62" fill="#f5a524" font-size="14" font-weight="600" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">SYNERGY '26 POKERBOTS · IIIT BANGALORE</text>
<text x="62" y="126" fill="#f0f4f8" font-size="56" font-weight="700">Hakari</text>
<text x="62" y="178" fill="#f0f4f8" font-size="40" font-weight="700">Discard Hold'em, <tspan fill="#f5a524">one bot.py</tspan></text>
<text x="64" y="216" fill="#9aa7b4" font-size="18">Equity engine + opponent model + CFR strategy table · Python standard library + NumPy only</text>
<text x="64" y="244" fill="#f5a524" font-size="18" font-weight="600">1.4 MB single file  ·  0 forfeits in testing  ·  inside the time bank at 1/6-speed CPU</text>
<text x="64" y="284" fill="#6f7d8c" font-size="13" font-weight="600" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">TEAM</text>
<text x="112" y="285" fill="#f0f4f8" font-size="18" font-weight="600">Hakari</text>
<text x="196" y="285" fill="#9aa7b4" font-size="15">Bhavya Jain, Kanav Bhardwaj</text><rect x="184" y="271" width="1" height="18" fill="#2c3946"/>
</g>
<g transform="translate(1030,165)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"><g transform="translate(-70,10.799999999999999) rotate(-18)"><rect x="-44" y="-66" width="88" height="124" rx="10" fill="#f5f7fa" fill-opacity="1" stroke="#d4a017" stroke-width="2"/><text x="0" y="14" font-size="48" font-weight="700" text-anchor="middle" fill="#d6322b">&#9829;</text><text x="-32" y="-42" font-size="20" font-weight="700" fill="#14161c">A</text></g><g transform="translate(0,0.0) rotate(0)"><rect x="-44" y="-66" width="88" height="124" rx="10" fill="#f5f7fa" fill-opacity="1" stroke="#d4a017" stroke-width="2"/><text x="0" y="14" font-size="48" font-weight="700" text-anchor="middle" fill="#14161c">&#9824;</text><text x="-32" y="-42" font-size="20" font-weight="700" fill="#14161c">K</text></g><g transform="translate(70,10.799999999999999) rotate(18)"><rect x="-44" y="-66" width="88" height="124" rx="10" fill="#f5f7fa" fill-opacity="0.35" stroke="#d4a017" stroke-width="2" stroke-dasharray="6 5"/><text x="0" y="14" font-size="48" font-weight="700" text-anchor="middle" fill="#d6322b">&#9829;</text><text x="-32" y="-42" font-size="20" font-weight="700" fill="#14161c">Q</text></g><text x="0" y="112" fill="#f5a524" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">discard one after the flop</text></g>
</svg>
